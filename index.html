<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio Arquitetura - Carregando...</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .loading-bg {
            background-image: url('assets/fundo-login.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
    </style>
</head>
<body class="loading-bg min-h-screen flex items-center justify-center">
    <!-- Overlay escuro -->
    <div class="absolute inset-0 bg-black/50"></div>

    <!-- Loading screen -->
    <div class="relative z-10 text-center text-white">
        <img src="assets/logo-engecon.png" alt="Logo Engecon" class="mx-auto mb-4 h-16">
        <h1 class="text-2xl font-bold mb-2">ESESP</h1>
        <p class="text-lg">Projeto de Urbanismo, Paisagismo e Sinalização do Estacionamento e Áreas Externas</p>
    </div>

    <script>
        function navigateTo(page) {
            const navLink = document.createElement('a');
            navLink.href = page;
            document.body.appendChild(navLink);
            navLink.click();
        }

        setTimeout(() => {
            const isAuthenticated = sessionStorage.getItem('isAuthenticated') === 'true';
            const loggedUser = sessionStorage.getItem('loggedInUser');

            if (isAuthenticated && loggedUser) {
                const users = JSON.parse(localStorage.getItem('portfolioUsers')) || {};
                if (users[loggedUser] && users[loggedUser].isFirstLogin) {
                    navigateTo('change-password.html');
                } else {
                    navigateTo('portfolio.html');
                }
            } else {
                navigateTo('login.html');
            }
        }, 1500);
    </script>
</body>
</html>
