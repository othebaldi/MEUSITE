<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Portfólio Arquitetura</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .login-bg {
            background-image: url('assets/fundo-login.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
    </style>
</head>
<body class="login-bg min-h-screen flex items-center justify-center">
    <!-- Overlay escuro para melhor legibilidade -->
    <div class="absolute inset-0 bg-black/50"></div>

    <!-- Container do formulário de login -->
    <div class="relative z-10 bg-white/95 backdrop-blur-sm p-8 rounded-2xl shadow-2xl w-full max-w-md mx-4">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">Acesso ao Portfólio</h1>
            <p class="text-gray-600">Faça login para visualizar os projetos</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-2">E-mail</label>
                <input type="email" id="email" name="email" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200" placeholder="seu.email@exemplo.com">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Senha</label>
                <input type="password" id="password" name="password" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200" placeholder="Digite sua senha">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition duration-200">Entrar</button>
        </form>

        <div id="errorMessage" class="hidden mt-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded-lg text-sm"></div>
    </div>

    <script>
        function navigateTo(page) {
            const navLink = document.createElement('a');
            navLink.href = page;
            document.body.appendChild(navLink);
            navLink.click();
        }

        if (sessionStorage.getItem('isAuthenticated') === 'true') {
            navigateTo('portfolio.html');
        }

        const users = JSON.parse(localStorage.getItem('portfolioUsers')) || {};

        function authenticateUser(email, password) {
            if (!users[email]) {
                return { success: false, message: 'Usuário não encontrado.' };
            }
            if (users[email].password !== password) {
                return { success: false, message: 'Senha incorreta.' };
            }
            return { success: true, isFirstLogin: users[email].isFirstLogin };
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const authResult = authenticateUser(email, password);

            if (authResult.success) {
                sessionStorage.setItem('loggedInUser', email);
                sessionStorage.setItem('isAuthenticated', 'true');
                if (authResult.isFirstLogin) {
                    navigateTo('change-password.html');
                } else {
                    navigateTo('portfolio.html');
                }
            } else {
                const errorDiv = document.getElementById('errorMessage');
                errorDiv.textContent = authResult.message;
                errorDiv.classList.remove('hidden');
            }
        });

        // Inicializar usuários se não existirem
        if (Object.keys(users).length === 0) {
            const exampleUsers = {
                'cliente1@email.com': { password: '123456', isFirstLogin: true },
                'cliente2@email.com': { password: 'abc123', isFirstLogin: true },
                'exemplo@email.com': { password: '987654', isFirstLogin: true }
            };
            localStorage.setItem('portfolioUsers', JSON.stringify(exampleUsers));
        }
    </script>
</body>
</html>
