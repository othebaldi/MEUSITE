<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Portfólio Arquitetura</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .login-bg {
            background-image: url('assets/fundo-login.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
    </style>
</head>
<body class="login-bg min-h-screen flex items-center justify-center">
    <!-- Overlay escuro para melhor legibilidade -->
    <div class="absolute inset-0 bg-black/50"></div>

    <!-- Container do formulário de login -->
    <div class="relative z-10 bg-white/95 backdrop-blur-sm p-8 rounded-2xl shadow-2xl w-full max-w-md mx-4">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">Acesso ao Portfólio</h1>
            <p class="text-gray-600">Faça login para visualizar os projetos</p>
        </div>

        <!-- Formulário de Login -->
        <form id="loginForm" class="space-y-6">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-2">E-mail</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    required 
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[rgb(255,165,44)] focus:border-transparent transition duration-200"
                    placeholder="seu.email@exemplo.com"
                >
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Senha</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    required 
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[rgb(255,165,44)] focus:border-transparent transition duration-200"
                    placeholder="Digite sua senha"
                >
            </div>

            <button 
                type="submit" 
                class="w-full bg-[rgb(255,165,44)] hover:bg-[rgb(230,149,40)] text-white font-semibold py-3 px-4 rounded-lg transition duration-200"
            >
                Entrar
            </button>
        </form>

        <!-- Mensagem de erro -->
        <div id="errorMessage" class="hidden mt-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded-lg text-sm"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {

            // --- ELEMENTOS DO DOM ---
            const loginForm = document.getElementById('loginForm');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const errorMessageDiv = document.getElementById('errorMessage');

            // --- MÓDULO DE AUTENTICAÇÃO ---
            const AuthService = {
                /**
                 * Inicializa os usuários padrão no localStorage se não existirem.
                 */
                initializeDefaultUsers() {
                    if (!localStorage.getItem('portfolioUsers')) {
                        const defaultUsers = {
                            'cliente1@email.com': { password: '555222', isFirstLogin: false, name: 'Cliente Um', createdAt: new Date().toISOString() },
                            'cliente2@email.com': { password: 'abc123', isFirstLogin: true, name: 'Cliente Dois', createdAt: new Date().toISOString() },
                            'exemplo@email.com': { password: '987654', isFirstLogin: true, name: 'Cliente Exemplo', createdAt: new Date().toISOString() }
                        };
                        localStorage.setItem('portfolioUsers', JSON.stringify(defaultUsers));
                    }
                },

                /**
                 * Autentica um usuário com base no email e senha.
                 * @param {string} email - O email do usuário.
                 * @param {string} password - A senha do usuário.
                 * @returns {object} - Objeto com o resultado da autenticação.
                 */
                authenticate(email, password) {
                    const users = JSON.parse(localStorage.getItem('portfolioUsers')) || {};
                    const user = users[email.toLowerCase()];

                    if (!user) {
                        return { success: false, message: 'Usuário não encontrado.' };
                    }
                    if (user.password !== password) {
                        return { success: false, message: 'Senha incorreta.' };
                    }
                    return { success: true, isFirstLogin: user.isFirstLogin };
                },

                /**
                 * Salva o estado de autenticação na sessão.
                 * @param {string} email - O email do usuário autenticado.
                 */
                setSession(email) {
                    sessionStorage.setItem('isAuthenticated', 'true');
                    sessionStorage.setItem('loggedInUser', email.toLowerCase());
                },

                /**
                 * Redireciona o usuário para a página apropriada após o login.
                 * @param {boolean} isFirstLogin - Indica se é o primeiro login do usuário.
                 */
                redirect(isFirstLogin) {
                    window.location.href = isFirstLogin ? 'change-password.html' : 'portfolio.html';
                }
            };
            
            // --- MÓDULO DE UI ---
            const UIController = {
                /**
                 * Exibe uma mensagem de erro no formulário.
                 * @param {string} message - A mensagem a ser exibida.
                 */
                showError(message) {
                    errorMessageDiv.textContent = message;
                    errorMessageDiv.classList.remove('hidden');
                    setTimeout(() => errorMessageDiv.classList.add('hidden'), 5000);
                },

                /**
                 * Redireciona para a página do portfólio se o usuário já estiver logado.
                 */
                checkExistingSession() {
                    if (sessionStorage.getItem('isAuthenticated') === 'true') {
                        window.location.href = 'portfolio.html';
                    }
                }
            };
            
            // --- INICIALIZAÇÃO E EVENTOS ---
            
            // Verifica se já existe uma sessão ativa.
            UIController.checkExistingSession();

            // Garante que os usuários padrão existam.
            AuthService.initializeDefaultUsers();

            // Adiciona o listener de evento ao formulário.
            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                
                const email = emailInput.value.trim();
                const password = passwordInput.value;

                if (!email || !password) {
                    UIController.showError('Por favor, preencha todos os campos.');
                    return;
                }

                // Lógica especial para o login do administrador.
                if (email.toLowerCase() === 'compras.thebaldi@gmail.com') {
                     window.location.href = 'admin.html';
                     return;
                }
                
                // Tenta autenticar o usuário.
                const authResult = AuthService.authenticate(email, password);
                
                if (authResult.success) {
                    AuthService.setSession(email);
                    AuthService.redirect(authResult.isFirstLogin);
                } else {
                    UIController.showError(authResult.message);
                }
            });
        });
    </script>
</body>
</html>
